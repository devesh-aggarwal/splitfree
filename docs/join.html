<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join on SplitFree</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="_style.css">
</head>
<body>
<main>
  <header><span class="mark">S</span><a href="https://splitfree.dev/">SplitFree</a></header>

  <h1>One moment</h1>
  <p class="sub">This invite now lives at splitfree.dev. Taking you there.</p>

  <div class="card">
    <p><a class="btn" id="open" href="https://splitfree.dev/join">Continue to splitfree.dev</a></p>
  </div>
</main>

<script>
  // The invite token sits in the fragment, which browsers never send to any
  // server. location.replace keeps it intact on the way to the new home.
  var target = "https://splitfree.dev/join" + (location.hash || "");
  document.getElementById("open").setAttribute("href", target);
  location.replace(target);
</script>
</body>
</html>
