<!--
  The sign-in email. Optional.

  Nothing needs this template. Both apps sign in by link, and Supabase's stock
  template sends one, so email sign-in works on a fresh project with no
  configuration at all.

  What this adds is the six-digit code beside the link. One /auth/v1/otp request
  produces both; the stock template just never shows the code. Having it matters
  when someone reads their email on a laptop and is signing in on their phone,
  where a link is useless and a code is not.

  Editing templates requires custom SMTP, so this only becomes available once you
  have connected a provider — which you need before real users arrive anyway,
  since the built-in sender only delivers to your own organisation.

  Paste this into Authentication -> Emails -> Magic Link.
-->
<h2>Your SplitFree code</h2>

<p style="font-size: 28px; letter-spacing: 4px; font-weight: 600;">{{ .Token }}</p>

<p>Enter this code in SplitFree to sign in. It expires in an hour.</p>

<p>Or <a href="{{ .ConfirmationURL }}">tap here</a> to sign in on this device.</p>

<p style="color: #666; font-size: 13px;">
  If you didn't ask to sign in, ignore this email. Nothing has changed.
</p>
