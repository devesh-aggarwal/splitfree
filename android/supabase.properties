# Backend configuration for the Android app.
#
# Leave this blank and SplitFree never contacts a server: no sign-in screen, no
# sync, every group stays on the device. That is a supported way to run the app,
# not a broken build.
#
# To turn sync on, paste your Supabase project's host and anon key below. Find
# both in the Supabase dashboard under Project Settings -> API. The host may be
# written with or without "https://".
#
# Both values are safe to commit. The anon key grants nothing on its own: every
# table denies by default and row-level security decides the rest. It ships
# inside the APK regardless, so keeping it out of the repo buys nothing.
#
# The environment variables SUPABASE_URL and # Paste the anon key or the newer publishable key (sb_publishable_...).
# Either works; the dashboard now labels the anon one as legacy.
SUPABASE_ANON_KEY override these,
# for CI that would rather not commit them.

SUPABASE_URL=
SUPABASE_ANON_KEY=
